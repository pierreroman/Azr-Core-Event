# Azure Developer CLI (azd) project configuration
# Run 'azd up' to provision infrastructure and deploy

name: community-online-event

metadata:
  template: community-online-event@0.0.2

services:
  web:
    project: .
    dist: .
    language: js
    host: staticwebapp
  
  api:
    project: ./api
    language: js
    host: function

hooks:
  postprovision:
    shell: pwsh
    run: |
      # Link Function App backend to Static Web App
      Write-Host "Linking Function App to Static Web App..."
      az staticwebapp backends link `
        --name $env:AZURE_STATICWEBAPP_NAME `
        --resource-group $env:AZURE_RESOURCE_GROUP `
        --backend-resource-id $env:AZURE_FUNCTION_APP_ID `
        --backend-region $env:AZURE_LOCATION

      # Ensure sitecontent blob container exists
      Write-Host "Verifying sitecontent blob container..."
      az storage container create `
        --name sitecontent `
        --account-name $env:AZURE_STORAGE_ACCOUNT_NAME `
        --auth-mode login `
        --public-access off 2>$null

      Write-Host "Post-provision complete."
