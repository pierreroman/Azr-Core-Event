# Fresh private deployments: ./deploy.ps1. Do not bootstrap with bare azd up.
name: community-online-event
metadata:
  template: community-online-event@0.0.3
services:
  # Frontend uses the pinned SWA CLI with --env production; azd's built-in
  # staticwebapp deploy uses an unsupported default-slot name.
  api:
    project: ./api
    language: js
    host: function
hooks:
  preprovision:
    shell: pwsh
    run: |
      & ./scripts/Test-ApiMigrationPrerequisites.ps1
      if (-not $?) { throw 'API migration prerequisite checks failed.' }
      & ./scripts/Register-Providers.ps1
      if (-not $?) { throw 'Resource provider registration failed.' }
  postprovision:
    shell: pwsh
    run: |
      & ./scripts/Sync-ApiBackend.ps1
      if (-not $?) { throw 'API backend synchronization failed.' }
      # Administrator invitations are explicit, not regenerated on every provision.
  predeploy:
    shell: pwsh
    run: |
      & ./scripts/Test-ApiMigrationPrerequisites.ps1
      if (-not $?) { throw 'API migration prerequisite checks failed.' }
      if ($env:API_NETWORK_STAGE -eq 'private' -or -not $env:API_NETWORK_STAGE) {
        & ./scripts/Test-PrivateDeploymentNetwork.ps1
        if (-not $?) { throw 'Private deployment network checks failed.' }
      } else {
        # Legacy migration stages only; new private bootstrap never uses this.
        az storage account update --subscription $env:AZURE_SUBSCRIPTION_ID `
          --name $env:AZURE_STORAGE_ACCOUNT_NAME --resource-group $env:AZURE_RESOURCE_GROUP `
          --public-network-access Enabled --output none
        if ($LASTEXITCODE -ne 0) { throw 'Could not enable legacy deployment storage access.' }
      }
  postdeploy:
    shell: pwsh
    run: |
      # Always restore/verify lockdown even if frontend deployment fails.
      try {
        & ./scripts/Deploy-Web.ps1
        if (-not $?) { throw 'Frontend deployment failed.' }
      } finally {
        az storage account update --subscription $env:AZURE_SUBSCRIPTION_ID `
          --name $env:AZURE_STORAGE_ACCOUNT_NAME --resource-group $env:AZURE_RESOURCE_GROUP `
          --public-network-access Disabled --output none
        if ($LASTEXITCODE -ne 0) { throw 'Failed to disable storage public network access.' }
      }
