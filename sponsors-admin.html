<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsors Admin - Community Online Event</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Markdown parser for description editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb" crossorigin="anonymous"></script>
    <!-- HTML sanitizer to prevent XSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha384-cwS6YdhLI7XS60eoDiC+egV0qHp8zI+Cms46R0nbn8JrmoAzV9uFL60etMZhAnSu" crossorigin="anonymous"></script>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🤝 Sponsors Management</h1>
            <div class="header-actions">
                <a href="admin.html" class="btn btn-secondary">← Admin Dashboard</a>
                <button class="btn btn-primary" onclick="openAddModal()">+ Add Sponsor</button>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="totalSponsors">0</div>
                <div class="stat-label">Total Sponsors</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="enabledSponsors">0</div>
                <div class="stat-label">Enabled</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="withLogos">0</div>
                <div class="stat-label">With Logos</div>
            </div>
        </div>

        <div id="sponsorsContainer" class="sponsors-admin-grid">
            <div class="loading">Loading sponsors...</div>
        </div>
    </div>

    <!-- Add/Edit Sponsor Modal -->
    <div id="sponsorModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h2 id="modalTitle">Add Sponsor</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="sponsorForm" onsubmit="saveSponsor(event)">
                <input type="hidden" id="sponsorId">

                <div class="form-group">
                    <label for="name">Sponsor Name *</label>
                    <input type="text" id="name" required placeholder="e.g., Microsoft">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tier">Tier</label>
                        <select id="tier">
                            <option value="platinum">🏆 Platinum</option>
                            <option value="gold">🥇 Gold</option>
                            <option value="silver" selected>🥈 Silver</option>
                            <option value="bronze">🥉 Bronze</option>
                            <option value="community">🌐 Community</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="sortOrder">Sort Order</label>
                        <input type="number" id="sortOrder" value="999" min="0" placeholder="Lower = first">
                    </div>
                </div>

                <div class="form-group">
                    <label for="website">Website URL</label>
                    <input type="url" id="website" placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label>Logo</label>
                    <input type="hidden" id="logoFile">
                    <div class="headshot-manager">
                        <div class="headshot-manager-preview">
                            <div class="headshot-preview" id="logoPreview" style="border-radius: 8px; width: 120px; height: 80px;">
                                <span style="color: var(--muted);">No logo</span>
                            </div>
                            <div class="headshot-selected-name" id="logoSelectedName">No logo selected</div>
                            <button type="button" class="btn btn-danger btn-small" id="logoClearBtn" onclick="clearLogo()" style="display:none;">Remove</button>
                        </div>
                        <div class="headshot-upload-area">
                            <div class="headshot-dropzone" id="logoDropzone">
                                <input type="file" id="logoFileInput" accept="image/jpeg,image/png,image/webp,image/svg+xml" style="display:none;" onchange="handleLogoFile(this.files[0])">
                                <div class="dropzone-content">
                                    <span class="dropzone-icon">🖼️</span>
                                    <span class="dropzone-text">Drag &amp; drop or <a href="#" onclick="event.preventDefault(); document.getElementById('logoFileInput').click();">browse</a></span>
                                    <span class="dropzone-hint">PNG, SVG, JPG, WebP &bull; Max 10MB &bull; Transparent background recommended</span>
                                </div>
                                <div class="dropzone-uploading" id="logoDropzoneUploading" style="display:none;">
                                    <div class="upload-spinner"></div>
                                    <span>Uploading...</span>
                                </div>
                            </div>
                        </div>
                        <div class="headshot-gallery-toggle">
                            <button type="button" class="btn btn-secondary btn-small" onclick="toggleLogoGallery()">📁 Choose from existing logos</button>
                        </div>
                        <div class="headshot-gallery" id="logoGallery" style="display:none;">
                            <div class="headshot-gallery-loading">Loading logos...</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description / Info (Markdown supported)</label>
                    <textarea id="description" rows="6" placeholder="Sponsor description, links, and info that will appear in the popup modal..."></textarea>
                    <div class="description-preview-toggle">
                        <button type="button" class="btn btn-secondary btn-small" onclick="toggleDescriptionPreview()">👁️ Preview</button>
                    </div>
                    <div id="descriptionPreview" class="markdown-preview-inline" style="display: none;">
                        <div class="markdown-content" id="descriptionPreviewContent"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="enabled" checked>
                        <span>Enabled (visible on public site)</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Sponsor</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const BLOB_STORAGE_URL = 'https://azcorestorage2026.blob.core.windows.net/sponsorlogos';
        let sponsors = [];
        let logoGalleryLoaded = false;

        // Load sponsors on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadSponsors();
        });

        function updateLogoPreview(filename) {
            const preview = document.getElementById('logoPreview');
            const nameEl = document.getElementById('logoSelectedName');
            const clearBtn = document.getElementById('logoClearBtn');
            if (filename) {
                preview.innerHTML = `<img src="${BLOB_STORAGE_URL}/${filename}" style="max-height: 80px; max-width: 200px; object-fit: contain;" onerror="this.parentElement.innerHTML='<span style=\'color: var(--muted);\'>Image not found</span>'">`;
                nameEl.textContent = filename;
                clearBtn.style.display = '';
            } else {
                preview.innerHTML = '<span style="color: var(--muted);">No logo</span>';
                nameEl.textContent = 'No logo selected';
                clearBtn.style.display = 'none';
            }
        }

        function clearLogo() {
            document.getElementById('logoFile').value = '';
            updateLogoPreview('');
            highlightLogoGallerySelection('');
        }

        function selectLogo(filename) {
            document.getElementById('logoFile').value = filename;
            updateLogoPreview(filename);
            highlightLogoGallerySelection(filename);
        }

        function highlightLogoGallerySelection(filename) {
            document.querySelectorAll('#logoGallery .headshot-gallery-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.filename === filename);
            });
        }

        // Drag & drop for logo
        (function initLogoDropzone() {
            const dz = document.getElementById('logoDropzone');
            ['dragenter', 'dragover'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('drag-over'); }));
            ['dragleave', 'drop'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('drag-over'); }));
            dz.addEventListener('drop', e => {
                const file = e.dataTransfer.files[0];
                if (file) handleLogoFile(file);
            });
        })();

        async function handleLogoFile(file) {
            if (!file) return;
            const allowed = ['image/jpeg', 'image/png', 'image/webp', 'image/svg+xml'];
            if (!allowed.includes(file.type)) { showAlert('Invalid file type. Use PNG, SVG, JPG, or WebP.', 'error'); return; }
            if (file.size > 10 * 1024 * 1024) { showAlert('File too large. Max 10MB.', 'error'); return; }

            const uploading = document.getElementById('logoDropzoneUploading');
            const content = document.getElementById('logoDropzone').querySelector('.dropzone-content');
            content.style.display = 'none';
            uploading.style.display = '';

            try {
                const formData = new FormData();
                formData.append('file', file);
                const resp = await fetch('/api/sponsors/logo', { method: 'POST', body: formData });
                const result = await resp.json();
                if (resp.ok) {
                    selectLogo(result.filename);
                    showAlert('Logo uploaded!', 'success');
                    if (document.getElementById('logoGallery').style.display !== 'none') {
                        logoGalleryLoaded = false;
                        await loadLogoGallery();
                    }
                } else {
                    showAlert(`Upload failed: ${result.error}`, 'error');
                }
            } catch (err) {
                console.error('Upload error:', err);
                showAlert('Failed to upload logo', 'error');
            } finally {
                content.style.display = '';
                uploading.style.display = 'none';
            }
        }

        async function toggleLogoGallery() {
            const gallery = document.getElementById('logoGallery');
            if (gallery.style.display === 'none') {
                gallery.style.display = '';
                if (!logoGalleryLoaded) await loadLogoGallery();
            } else {
                gallery.style.display = 'none';
            }
        }

        async function loadLogoGallery() {
            const gallery = document.getElementById('logoGallery');
            gallery.innerHTML = '<div class="headshot-gallery-loading">Loading logos...</div>';
            try {
                const resp = await fetch('/api/sponsors/logos', { cache: 'no-cache' });
                const data = await resp.json();
                const logos = data.logos || [];
                const currentFile = document.getElementById('logoFile').value;
                if (logos.length === 0) {
                    gallery.innerHTML = '<div class="headshot-gallery-empty">No logos uploaded yet.</div>';
                    return;
                }
                gallery.innerHTML = logos.map(l => `
                    <div class="headshot-gallery-item${l.name === currentFile ? ' selected' : ''}" data-filename="${escapeHtml(l.name)}" onclick="selectLogo('${escapeHtml(l.name)}')">
                        <img src="${BLOB_STORAGE_URL}/${l.name}" alt="${escapeHtml(l.name)}" style="object-fit: contain;" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2220%22>❌</text></svg>'">
                        <span class="gallery-item-name">${escapeHtml(l.name)}</span>
                    </div>
                `).join('');
                logoGalleryLoaded = true;
            } catch (err) {
                console.error('Error loading logo gallery:', err);
                gallery.innerHTML = '<div class="headshot-gallery-empty">Failed to load logos.</div>';
            }
        }

        function toggleDescriptionPreview() {
            const previewEl = document.getElementById('descriptionPreview');
            const contentEl = document.getElementById('descriptionPreviewContent');
            const desc = document.getElementById('description').value;

            if (previewEl.style.display === 'none') {
                contentEl.innerHTML = parseMarkdown(desc || '*No description yet*');
                previewEl.style.display = 'block';
            } else {
                previewEl.style.display = 'none';
            }
        }

        function parseMarkdown(content) {
            if (typeof marked === 'undefined') return DOMPurify.sanitize(content);
            try {
                const html = typeof marked.parse === 'function' ? marked.parse(content) : marked(content);
                return DOMPurify.sanitize(html);
            } catch (e) {
                return DOMPurify.sanitize(content);
            }
        }

        async function loadSponsors() {
            try {
                const response = await fetch('/api/sponsors', { cache: 'no-cache' });
                const data = await response.json();
                sponsors = data.sponsors || [];
                renderSponsors();
                updateStats();
            } catch (error) {
                console.error('Error loading sponsors:', error);
                showAlert('Failed to load sponsors', 'error');
            }
        }

        function updateStats() {
            document.getElementById('totalSponsors').textContent = sponsors.length;
            document.getElementById('enabledSponsors').textContent = sponsors.filter(s => s.enabled).length;
            document.getElementById('withLogos').textContent = sponsors.filter(s => s.logoFile).length;
        }

        const tierLabels = {
            platinum: '🏆 Platinum',
            gold: '🥇 Gold',
            silver: '🥈 Silver',
            bronze: '🥉 Bronze',
            community: '🌐 Community'
        };

        function renderSponsors() {
            const container = document.getElementById('sponsorsContainer');

            if (sponsors.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <h3>No sponsors yet</h3>
                        <p>Click "Add Sponsor" to add your first sponsor.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sponsors.map(sponsor => `
                <div class="sponsor-admin-card ${!sponsor.enabled ? 'sponsor-disabled' : ''}">
                    <div class="sponsor-card-logo">
                        ${sponsor.logoFile
                            ? `<img src="${BLOB_STORAGE_URL}/${sponsor.logoFile}" alt="${escapeHtml(sponsor.name)}" onerror="this.parentElement.innerHTML='🤝'">`
                            : '🤝'
                        }
                    </div>
                    <div class="sponsor-card-info">
                        <h3 class="sponsor-card-name">${escapeHtml(sponsor.name)}</h3>
                        <span class="sponsor-tier-badge tier-${sponsor.tier}">${tierLabels[sponsor.tier] || sponsor.tier}</span>
                        ${!sponsor.enabled ? '<span class="sponsor-disabled-badge">Disabled</span>' : ''}
                        ${sponsor.website ? `<a href="${escapeHtml(sponsor.website)}" target="_blank" class="sponsor-website-link" title="Visit website">🔗</a>` : ''}
                    </div>
                    <div class="sponsor-card-actions">
                        <button class="btn btn-secondary btn-small" onclick="editSponsor('${sponsor.id}')">Edit</button>
                        <button class="btn btn-${sponsor.enabled ? 'warning' : 'success'} btn-small" onclick="toggleSponsor('${sponsor.id}', ${!sponsor.enabled})">${sponsor.enabled ? 'Disable' : 'Enable'}</button>
                        <button class="btn btn-danger btn-small" onclick="deleteSponsor('${sponsor.id}', '${escapeHtml(sponsor.name)}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Sponsor';
            document.getElementById('sponsorForm').reset();
            document.getElementById('sponsorId').value = '';
            document.getElementById('enabled').checked = true;
            document.getElementById('tier').value = 'silver';
            document.getElementById('sortOrder').value = '999';
            document.getElementById('logoFile').value = '';
            logoGalleryLoaded = false;
            document.getElementById('logoGallery').style.display = 'none';
            updateLogoPreview('');
            document.getElementById('descriptionPreview').style.display = 'none';
            document.getElementById('sponsorModal').classList.add('active');
        }

        function editSponsor(id) {
            const sponsor = sponsors.find(s => s.id === id);
            if (!sponsor) return;

            document.getElementById('modalTitle').textContent = 'Edit Sponsor';
            document.getElementById('sponsorId').value = sponsor.id;
            document.getElementById('name').value = sponsor.name;
            document.getElementById('tier').value = sponsor.tier || 'silver';
            document.getElementById('sortOrder').value = sponsor.sortOrder || 999;
            document.getElementById('website').value = sponsor.website || '';
            document.getElementById('logoFile').value = sponsor.logoFile || '';
            document.getElementById('description').value = sponsor.description || '';
            document.getElementById('enabled').checked = sponsor.enabled;
            logoGalleryLoaded = false;
            document.getElementById('logoGallery').style.display = 'none';
            updateLogoPreview(sponsor.logoFile);
            document.getElementById('descriptionPreview').style.display = 'none';

            document.getElementById('sponsorModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('sponsorModal').classList.remove('active');
        }

        async function saveSponsor(event) {
            event.preventDefault();

            const id = document.getElementById('sponsorId').value;
            const sponsorData = {
                name: document.getElementById('name').value,
                tier: document.getElementById('tier').value,
                sortOrder: parseInt(document.getElementById('sortOrder').value) || 999,
                website: document.getElementById('website').value,
                logoFile: document.getElementById('logoFile').value,
                description: document.getElementById('description').value,
                enabled: document.getElementById('enabled').checked
            };

            try {
                let response;
                if (id) {
                    response = await fetch(`/api/sponsors/${encodeURIComponent(id)}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(sponsorData)
                    });
                } else {
                    response = await fetch('/api/sponsors', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(sponsorData)
                    });
                }

                if (response.ok) {
                    showAlert(id ? 'Sponsor updated!' : 'Sponsor created!', 'success');
                    closeModal();
                    await loadSponsors();
                } else {
                    const error = await response.json();
                    showAlert(`Error: ${error.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error saving sponsor:', error);
                showAlert('Failed to save sponsor', 'error');
            }
        }

        async function toggleSponsor(id, enabled) {
            try {
                const response = await fetch(`/api/sponsors/${encodeURIComponent(id)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });

                if (response.ok) {
                    showAlert(`Sponsor ${enabled ? 'enabled' : 'disabled'}`, 'success');
                    await loadSponsors();
                } else {
                    const error = await response.json();
                    showAlert(`Error: ${error.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error toggling sponsor:', error);
                showAlert('Failed to update sponsor', 'error');
            }
        }

        async function deleteSponsor(id, name) {
            if (!confirm(`Delete sponsor "${name}"?`)) return;

            try {
                const response = await fetch(`/api/sponsors/${encodeURIComponent(id)}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Sponsor deleted', 'success');
                    await loadSponsors();
                } else {
                    const error = await response.json();
                    showAlert(`Error: ${error.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error deleting sponsor:', error);
                showAlert('Failed to delete sponsor', 'error');
            }
        }

        // ==================== HELPERS ====================

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.innerHTML = '';
            container.appendChild(alert);

            if (type !== 'info') {
                setTimeout(() => alert.remove(), 5000);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal on outside click
        document.getElementById('sponsorModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
