<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speakers Admin - Community Online Event</title>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/Azure-A-16px.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-rail="admin" data-rail-active="speakers">
    <!-- Skip to main content link for accessibility -->
    <a href="#speakersContainer" class="skip-link">Skip to main content</a>

    <div class="admin-container">
        <div class="admin-header">
            <h1>🎤 Speakers Management</h1>
            <div class="header-actions">
                <button class="btn btn-success" onclick="extractSpeakers()">🔍 Extract from Schedule</button>
                <button class="btn btn-primary" onclick="openAddModal()">+ Add Speaker</button>
            </div>
        </div>
        
        <div id="alertContainer"></div>

        <div class="bulk-actions-bar" id="bulkActionsBar">
            <label class="bulk-select-all">
                <input type="checkbox" id="selectAllSpeakers" onchange="toggleSelectAll(this.checked)">
                Select all
            </label>
            <span class="bulk-selected-count" id="bulkSelectedCount">0 selected</span>
            <button id="bulkDeleteBtn" class="btn btn-danger btn-small" onclick="deleteSelectedSpeakers()" disabled>
                🗑️ Delete selected
            </button>
        </div>
        
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="totalSpeakers">0</div>
                <div class="stat-label">Total Speakers</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="withHeadshots">0</div>
                <div class="stat-label">With Headshots</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="withBio">0</div>
                <div class="stat-label">With Bio</div>
            </div>
        </div>
        
        <div id="speakersContainer" class="speakers-grid">
            <div class="loading">Loading speakers...</div>
        </div>
    </div>
    
    <!-- Add/Edit Modal -->
    <div id="speakerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Speaker</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="speakerForm" onsubmit="saveSpeaker(event)">
                <input type="hidden" id="speakerId">
                
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Title/Role</label>
                        <input type="text" id="title" placeholder="e.g., Principal Cloud Advocate">
                    </div>
                    <div class="form-group">
                        <label for="company">Company</label>
                        <input type="text" id="company" placeholder="e.g., Microsoft">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" placeholder="Short biography..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Headshot</label>
                    <input type="hidden" id="headshotFile">
                    <div class="headshot-manager">
                        <div class="headshot-manager-preview">
                            <div class="headshot-preview" id="headshotPreview">
                                <span style="color: var(--muted);">No image</span>
                            </div>
                            <div class="headshot-selected-name" id="headshotSelectedName">No headshot selected</div>
                            <button type="button" class="btn btn-danger btn-small" id="headshotClearBtn" onclick="clearHeadshot()" style="display:none;">Remove</button>
                        </div>
                        <div class="headshot-upload-area">
                            <div class="headshot-dropzone" id="headshotDropzone">
                                <input type="file" id="headshotFileInput" accept="image/jpeg,image/png,image/webp" style="display:none;" onchange="handleHeadshotFile(this.files[0])">
                                <div class="dropzone-content">
                                    <span class="dropzone-icon">📷</span>
                                    <span class="dropzone-text">Drag &amp; drop or <a href="#" onclick="event.preventDefault(); document.getElementById('headshotFileInput').click();">browse</a></span>
                                    <span class="dropzone-hint">JPG, PNG, WebP &bull; Max 10MB &bull; 400&times;400px recommended</span>
                                </div>
                                <div class="dropzone-uploading" id="dropzoneUploading" style="display:none;">
                                    <div class="upload-spinner"></div>
                                    <span>Uploading...</span>
                                </div>
                            </div>
                        </div>
                        <div class="headshot-gallery-toggle">
                            <button type="button" class="btn btn-secondary btn-small" onclick="toggleHeadshotGallery()">📁 Choose from existing headshots</button>
                        </div>
                        <div class="headshot-gallery" id="headshotGallery" style="display:none;">
                            <div class="headshot-gallery-loading">Loading headshots...</div>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="linkedin">LinkedIn URL</label>
                        <input type="url" id="linkedin" placeholder="https://linkedin.com/in/...">
                    </div>
                    <div class="form-group">
                        <label for="twitter">Twitter/X URL</label>
                        <input type="url" id="twitter" placeholder="https://twitter.com/...">
                    </div>
                </div>

                <div class="form-group">
                    <label>Sessions</label>
                    <div class="session-picker">
                        <div class="session-picker-list" id="speakerSessionsList">
                            <span class="text-muted">No sessions assigned</span>
                        </div>
                        <div class="session-picker-add">
                            <select id="sessionDropdown" class="form-input">
                                <option value="">— Add a session —</option>
                            </select>
                            <button type="button" class="btn btn-secondary btn-small" onclick="addSessionToSpeaker()">+ Add</button>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Speaker</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let speakers = [];
        let allSessions = [];       // All schedule sessions
        let pickedSessionIds = [];  // Session IDs currently assigned to the speaker being edited
        
        // Load speakers on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([loadSpeakers(), loadAllSessions()]);
        });

        // Load schedule sessions for the session picker
        async function loadAllSessions() {
            try {
                const resp = await fetch('/api/schedule');
                const data = await resp.json();
                allSessions = data.schedule || [];
            } catch (err) {
                console.error('Error loading sessions:', err);
                allSessions = [];
            }
        }
        
        const STORAGE_BASE = ''; // Will be set dynamically from API
        let storageBase = '';
        let galleryLoaded = false;

        function updateHeadshotPreview(filename) {
            const preview = document.getElementById('headshotPreview');
            const nameEl = document.getElementById('headshotSelectedName');
            const clearBtn = document.getElementById('headshotClearBtn');
            if (filename) {
                preview.innerHTML = `<img src="${storageBase}/${filename}" onerror="this.parentElement.innerHTML='<span style=\'color: var(--muted);\'>Image not found</span>'">`;
                nameEl.textContent = filename;
                clearBtn.style.display = '';
            } else {
                preview.innerHTML = '<span style="color: var(--muted);">No image</span>';
                nameEl.textContent = 'No headshot selected';
                clearBtn.style.display = 'none';
            }
        }

        function clearHeadshot() {
            document.getElementById('headshotFile').value = '';
            updateHeadshotPreview('');
            highlightGallerySelection('');
        }

        function selectHeadshot(filename) {
            document.getElementById('headshotFile').value = filename;
            updateHeadshotPreview(filename);
            highlightGallerySelection(filename);
        }

        function highlightGallerySelection(filename) {
            document.querySelectorAll('.headshot-gallery-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.filename === filename);
            });
        }

        // Drag & drop
        (function initDropzone() {
            const dz = document.getElementById('headshotDropzone');
            ['dragenter', 'dragover'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('drag-over'); }));
            ['dragleave', 'drop'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('drag-over'); }));
            dz.addEventListener('drop', e => {
                const file = e.dataTransfer.files[0];
                if (file) handleHeadshotFile(file);
            });
        })();

        async function handleHeadshotFile(file) {
            if (!file) return;
            const allowed = ['image/jpeg', 'image/png', 'image/webp'];
            if (!allowed.includes(file.type)) { showAlert('Invalid file type. Use JPG, PNG, or WebP.', 'error'); return; }
            if (file.size > 10 * 1024 * 1024) { showAlert('File too large. Max 10MB.', 'error'); return; }

            const dz = document.getElementById('headshotDropzone');
            const uploading = document.getElementById('dropzoneUploading');
            const content = dz.querySelector('.dropzone-content');
            content.style.display = 'none';
            uploading.style.display = '';

            try {
                const formData = new FormData();
                formData.append('file', file);
                const resp = await fetch('/api/speakers/headshot', { method: 'POST', body: formData });
                const result = await resp.json();
                if (resp.ok) {
                    selectHeadshot(result.filename);
                    showAlert('Headshot uploaded!', 'success');
                    // Refresh gallery if open
                    if (document.getElementById('headshotGallery').style.display !== 'none') {
                        galleryLoaded = false;
                        await loadHeadshotGallery();
                    }
                } else {
                    showAlert(`Upload failed: ${result.error}`, 'error');
                }
            } catch (err) {
                console.error('Upload error:', err);
                showAlert('Failed to upload headshot', 'error');
            } finally {
                content.style.display = '';
                uploading.style.display = 'none';
            }
        }

        async function toggleHeadshotGallery() {
            const gallery = document.getElementById('headshotGallery');
            if (gallery.style.display === 'none') {
                gallery.style.display = '';
                if (!galleryLoaded) await loadHeadshotGallery();
            } else {
                gallery.style.display = 'none';
            }
        }

        async function loadHeadshotGallery() {
            const gallery = document.getElementById('headshotGallery');
            gallery.innerHTML = '<div class="headshot-gallery-loading">Loading headshots...</div>';
            try {
                const resp = await fetch('/api/speakers/headshots', { cache: 'no-cache' });
                const data = await resp.json();
                const headshots = data.headshots || [];
                const currentFile = document.getElementById('headshotFile').value;
                if (headshots.length === 0) {
                    gallery.innerHTML = '<div class="headshot-gallery-empty">No headshots uploaded yet.</div>';
                    return;
                }
                gallery.innerHTML = headshots.map(h => `
                    <div class="headshot-gallery-item${h.name === currentFile ? ' selected' : ''}" data-filename="${escapeHtml(h.name)}" onclick="selectHeadshot('${escapeHtml(h.name)}')">
                        <img src="${storageBase}/${h.name}" alt="${escapeHtml(h.name)}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2220%22>❌</text></svg>'">
                        <span class="gallery-item-name">${escapeHtml(h.name)}</span>
                    </div>
                `).join('');
                galleryLoaded = true;
            } catch (err) {
                console.error('Error loading gallery:', err);
                gallery.innerHTML = '<div class="headshot-gallery-empty">Failed to load headshots.</div>';
            }
        }
        
        async function loadSpeakers() {
            try {
                const response = await fetch('/api/speakers', { cache: 'no-cache' });
                const data = await response.json();
                speakers = data.speakers || [];
                storageBase = data.storageBaseUrl || storageBase;
                renderSpeakers();
                updateStats();
            } catch (error) {
                console.error('Error loading speakers:', error);
                showAlert('Failed to load speakers', 'error');
            }
        }
        
        function updateStats() {
            document.getElementById('totalSpeakers').textContent = speakers.length;
            document.getElementById('withHeadshots').textContent = speakers.filter(s => s.headshotFile).length;
            document.getElementById('withBio').textContent = speakers.filter(s => s.bio).length;
        }
        
        function renderSpeakers() {
            const container = document.getElementById('speakersContainer');
            
            if (speakers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <h3>No speakers yet</h3>
                        <p>Click "Extract from Schedule" to automatically extract speakers from session descriptions,<br>
                        or click "Add Speaker" to add one manually.</p>
                    </div>
                `;
                updateBulkSelectionUi();
                return;
            }
            
            container.innerHTML = speakers.map(speaker => `
                <div class="speaker-card">
                    <label class="speaker-card-select" title="Select speaker">
                        <input type="checkbox" class="speaker-select-checkbox" data-speaker-id="${speaker.id}" onchange="updateBulkSelectionUi()">
                    </label>
                    <div class="speaker-card-header">
                        <div class="speaker-headshot">
                            ${speaker.headshotFile 
                                ? `<img src="${storageBase}/${speaker.headshotFile}" onerror="this.parentElement.innerHTML='👤'" alt="${speaker.name}">`
                                : '👤'
                            }
                        </div>
                        <div class="speaker-info">
                            <h3 class="speaker-name">${escapeHtml(speaker.name)}</h3>
                            <p class="speaker-title">${escapeHtml(speaker.title) || '<em>No title</em>'}</p>
                            <p class="speaker-company">${escapeHtml(speaker.company) || ''}</p>
                        </div>
                    </div>
                    <div class="speaker-sessions">
                        <div class="speaker-sessions-label">Sessions</div>
                        <div class="speaker-sessions-count">${speaker.sessionIds?.length || 0} session(s)</div>
                    </div>
                    <div class="speaker-card-actions">
                        <button class="btn btn-secondary btn-small" onclick="editSpeaker('${speaker.id}')">Edit</button>
                        <button class="btn btn-danger btn-small" onclick="deleteSpeaker('${speaker.id}', '${escapeHtml(speaker.name)}')">Delete</button>
                    </div>
                </div>
            `).join('');

            updateBulkSelectionUi();
        }

        function getSelectedSpeakerIds() {
            return Array.from(document.querySelectorAll('.speaker-select-checkbox:checked'))
                .map(el => el.dataset.speakerId);
        }

        function updateBulkSelectionUi() {
            const checkboxes = document.querySelectorAll('.speaker-select-checkbox');
            const selected = getSelectedSpeakerIds();
            const countEl = document.getElementById('bulkSelectedCount');
            const deleteBtn = document.getElementById('bulkDeleteBtn');
            const selectAll = document.getElementById('selectAllSpeakers');

            if (countEl) countEl.textContent = `${selected.length} selected`;
            if (deleteBtn) deleteBtn.disabled = selected.length === 0;

            if (selectAll) {
                if (checkboxes.length === 0) {
                    selectAll.checked = false;
                    selectAll.indeterminate = false;
                    selectAll.disabled = true;
                } else {
                    selectAll.disabled = false;
                    selectAll.checked = selected.length === checkboxes.length;
                    selectAll.indeterminate = selected.length > 0 && selected.length < checkboxes.length;
                }
            }
        }

        function toggleSelectAll(checked) {
            document.querySelectorAll('.speaker-select-checkbox').forEach(cb => { cb.checked = checked; });
            updateBulkSelectionUi();
        }

        async function deleteSelectedSpeakers() {
            const ids = getSelectedSpeakerIds();
            if (ids.length === 0) return;

            if (!confirm(`Delete ${ids.length} selected speaker(s)? This cannot be undone.`)) return;

            const deleteBtn = document.getElementById('bulkDeleteBtn');
            if (deleteBtn) deleteBtn.disabled = true;

            const results = await Promise.allSettled(ids.map(id =>
                fetch(`/api/speakers/${encodeURIComponent(id)}`, { method: 'DELETE' })
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return id;
                    })
            ));

            const failures = results.filter(r => r.status === 'rejected').length;
            const succeeded = results.length - failures;

            if (failures === 0) {
                showAlert(`Deleted ${succeeded} speaker(s)`, 'success');
            } else if (succeeded === 0) {
                showAlert(`Failed to delete ${failures} speaker(s)`, 'error');
            } else {
                showAlert(`Deleted ${succeeded}, failed ${failures}`, 'info');
            }

            await loadSpeakers();
        }
        
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Speaker';
            document.getElementById('speakerForm').reset();
            document.getElementById('speakerId').value = '';
            document.getElementById('headshotFile').value = '';
            pickedSessionIds = [];
            galleryLoaded = false;
            document.getElementById('headshotGallery').style.display = 'none';
            updateHeadshotPreview('');
            renderSessionPicker();
            document.getElementById('speakerModal').classList.add('active');
        }
        
        function editSpeaker(id) {
            const speaker = speakers.find(s => s.id === id);
            if (!speaker) return;
            
            document.getElementById('modalTitle').textContent = 'Edit Speaker';
            document.getElementById('speakerId').value = speaker.id;
            document.getElementById('name').value = speaker.name;
            document.getElementById('title').value = speaker.title || '';
            document.getElementById('company').value = speaker.company || '';
            document.getElementById('bio').value = speaker.bio || '';
            document.getElementById('headshotFile').value = speaker.headshotFile || '';
            document.getElementById('linkedin').value = speaker.linkedin || '';
            document.getElementById('twitter').value = speaker.twitter || '';
            pickedSessionIds = [...(speaker.sessionIds || [])];
            galleryLoaded = false;
            document.getElementById('headshotGallery').style.display = 'none';
            updateHeadshotPreview(speaker.headshotFile);
            renderSessionPicker();
            
            document.getElementById('speakerModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('speakerModal').classList.remove('active');
        }
        
        async function saveSpeaker(event) {
            event.preventDefault();
            
            const id = document.getElementById('speakerId').value;
            const speakerData = {
                name: document.getElementById('name').value,
                title: document.getElementById('title').value,
                company: document.getElementById('company').value,
                bio: document.getElementById('bio').value,
                headshotFile: document.getElementById('headshotFile').value,
                linkedin: document.getElementById('linkedin').value,
                twitter: document.getElementById('twitter').value,
                sessionIds: pickedSessionIds
            };
            
            try {
                let response;
                if (id) {
                    // Update existing
                    response = await fetch(`/api/speakers/${encodeURIComponent(id)}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(speakerData)
                    });
                } else {
                    // Create new
                    response = await fetch('/api/speakers', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(speakerData)
                    });
                }
                
                if (response.ok) {
                    showAlert(id ? 'Speaker updated!' : 'Speaker created!', 'success');
                    closeModal();
                    await loadSpeakers();
                } else {
                    const error = await response.json();
                    showAlert(`Error: ${error.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error saving speaker:', error);
                showAlert('Failed to save speaker', 'error');
            }
        }
        
        async function deleteSpeaker(id, name) {
            if (!confirm(`Delete speaker "${name}"?`)) return;
            
            try {
                const response = await fetch(`/api/speakers/${encodeURIComponent(id)}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showAlert('Speaker deleted', 'success');
                    await loadSpeakers();
                } else {
                    const error = await response.json();
                    showAlert(`Error: ${error.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error deleting speaker:', error);
                showAlert('Failed to delete speaker', 'error');
            }
        }
        
        async function extractSpeakers() {
            if (!confirm('This will scan all session descriptions and extract speaker names. Continue?')) return;
            
            showAlert('Extracting speakers from schedule...', 'info');
            
            try {
                const response = await fetch('/api/speakers/extract', {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showAlert(`Extraction complete: ${result.created} created, ${result.updated} updated`, 'success');
                    await loadSpeakers();
                } else {
                    showAlert(`Error: ${result.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error extracting speakers:', error);
                showAlert('Failed to extract speakers', 'error');
            }
        }
        
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.innerHTML = '';
            container.appendChild(alert);
            
            if (type !== 'info') {
                setTimeout(() => alert.remove(), 5000);
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Close modal on outside click
        document.getElementById('speakerModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        
        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ── Session Picker ──────────────────────────────────────────
        function renderSessionPicker() {
            const listEl = document.getElementById('speakerSessionsList');
            const dropdown = document.getElementById('sessionDropdown');

            // Render assigned sessions
            if (pickedSessionIds.length === 0) {
                listEl.innerHTML = '<span class="text-muted">No sessions assigned</span>';
            } else {
                listEl.innerHTML = pickedSessionIds.map(sid => {
                    const session = allSessions.find(s => s.id === sid);
                    const label = session
                        ? `${escapeHtml(session.title)}`
                        : `<em>${escapeHtml(sid)}</em>`;
                    const time = session
                        ? `<span class="session-tag-time">${new Date(session.startTime).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>`
                        : '';
                    return `
                        <div class="session-tag">
                            ${time}
                            <span class="session-tag-title">${label}</span>
                            <button type="button" class="session-tag-remove" onclick="removeSessionFromSpeaker('${escapeHtml(sid)}')" title="Remove">&times;</button>
                        </div>
                    `;
                }).join('');
            }

            // Populate dropdown with sessions not yet assigned
            const available = allSessions.filter(s => !pickedSessionIds.includes(s.id));
            dropdown.innerHTML = '<option value="">— Add a session —</option>' +
                available.map(s => {
                    const d = new Date(s.startTime).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
                    return `<option value="${escapeHtml(s.id)}">${escapeHtml(s.title)} (${d})</option>`;
                }).join('');
        }

        function addSessionToSpeaker() {
            const dropdown = document.getElementById('sessionDropdown');
            const sid = dropdown.value;
            if (!sid || pickedSessionIds.includes(sid)) return;
            pickedSessionIds.push(sid);
            renderSessionPicker();
        }

        function removeSessionFromSpeaker(sid) {
            pickedSessionIds = pickedSessionIds.filter(id => id !== sid);
            renderSessionPicker();
        }
    </script>
    <script src="rail.js" defer></script>
</body>
</html>
