<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/Azure-A-16px.png">
    <link rel="stylesheet" href="styles.css">
    <!-- Markdown parser for content sections -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb" crossorigin="anonymous"></script>
    <!-- HTML sanitizer to prevent XSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha384-cwS6YdhLI7XS60eoDiC+egV0qHp8zI+Cms46R0nbn8JrmoAzV9uFL60etMZhAnSu" crossorigin="anonymous"></script>
</head>
<body data-rail="public" data-rail-active="about">
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <main id="main-content">
        <section id="about">
            <div id="about-content" class="markdown-content">
                <div class="loading">Loading about content...</div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="https://www.microsoft.com/en-us/privacy/privacystatement" target="_blank" rel="noopener">Privacy Policy</a>
            <a href="#" onclick="openCodeOfConduct(); return false;">Code of Conduct</a>
            <a href="/admin.html">Admin</a>
            <a href="https://azure.microsoft.com" target="_blank" rel="noopener">Powered by Azure</a>
        </div>
        <p class="copyright">© 2026 Community Online Event. All rights reserved.</p>
    </footer>

    <!-- Registration Modal -->
    <div id="registration-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="registration-modal-title">
        <div class="modal-content registration-modal-content">
            <button class="modal-close" onclick="closeRegistrationModal()" aria-label="Close registration">&times;</button>
            <div class="registration-modal-icon">🎟️</div>
            <h2 class="modal-title" id="registration-modal-title">Register Now</h2>
            <div class="registration-modal-description markdown-content" id="registration-modal-description">Join us for this community event! Click the link below to register.</div>
            <div class="registration-modal-actions">
                <a id="registration-modal-link" href="#" target="_blank" rel="noopener" class="btn-register-action">Register Now</a>
            </div>
        </div>
    </div>

    <!-- Code of Conduct Modal -->
    <div id="coc-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Code of Conduct">
        <div class="modal-content coc-modal-content">
            <button class="modal-close" onclick="closeCodeOfConduct()" aria-label="Close code of conduct">&times;</button>
            <div id="coc-content" class="markdown-content coc-content">
                <div class="loading">Loading code of conduct...</div>
            </div>
        </div>
    </div>

    <script src="rail.js" defer></script>
    <script src="site.js" defer></script>

</body>
</html>
